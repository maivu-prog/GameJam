<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Unity Web Player | GameJam</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Self-contained portrait layout so it survives an index.html re-export from Unity.
         The game is 1080x2340 (9:19.5). Fit it inside the window keeping that aspect; never stretch. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #231F20; }
      /* Pin the game box to the viewport centre (not the body, which can grow taller and add a scrollbar). */
      #unity-container { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #unity-canvas { display: block; }
      /* Unity's footer bar sits BELOW the canvas and steals height from a portrait game — hide it. */
      #unity-footer { display: none !important; }
      /* Fullscreen button is lifted out of the hidden footer and floated over the canvas. */
      #unity-fullscreen-button {
        display: block; position: fixed; right: 12px; top: 12px; z-index: 5;
        width: 38px; height: 38px; cursor: pointer; opacity: .5;
        background: url('TemplateData/fullscreen-button.png') no-repeat center; background-size: contain;
        border-radius: 6px;
      }
      #unity-fullscreen-button:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=2340 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <!-- Fullscreen lives outside the footer so hiding the footer does not hide it too. -->
      <div id="unity-fullscreen-button"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-build-title">GameJam</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "GameJam",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Fit the 1080x2340 game inside the window on BOTH axes, keeping aspect — never cropped, never stretched.
      // Height decides unless the window is unusually narrow, in which case width does.
      var ASPECT = 1080 / 2340;
      function fitCanvas() {
        var availH = Math.max(1, window.innerHeight);
        var availW = Math.max(1, window.innerWidth);
        var h = Math.min(availH, availW / ASPECT);
        var w = h * ASPECT;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("load", fitCanvas);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
